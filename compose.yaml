name: niyat

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-niyat}
      POSTGRES_USER: ${POSTGRES_USER:-niyat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-niyat_local_only}
    ports:
      - "127.0.0.1:${NIYAT_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./.local/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-niyat} -d ${POSTGRES_DB:-niyat}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    stop_grace_period: 30s

  # One-off jobs: never started by a plain `docker compose up`, only when named (`docker compose run --rm migrate …`).
  migrate:
    image: niyat-api:local
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-niyat}:${POSTGRES_PASSWORD:-niyat_local_only}@postgres:5432/${POSTGRES_DB:-niyat}
      NIYAT_APP_DB_USER: ${NIYAT_APP_DB_USER:-niyat_app}
      NIYAT_APP_DB_PASSWORD: ${NIYAT_APP_DB_PASSWORD:-niyat_app_local_only_password}
    # Schema changes run as the owner; the API itself connects as the least-privilege runtime role.
    command: ["sh", "-c", "npm run db:migrate && npm run db:provision-role"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    image: niyat-api:local
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-niyat}:${POSTGRES_PASSWORD:-niyat_local_only}@postgres:5432/${POSTGRES_DB:-niyat}
    command: ["npm", "run", "db:seed:private-alpha"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: niyat-api:local
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${NIYAT_APP_DB_USER:-niyat_app}:${NIYAT_APP_DB_PASSWORD:-niyat_app_local_only_password}@postgres:5432/${POSTGRES_DB:-niyat}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      NODE_ENV: ${NIYAT_NODE_ENV:-development}
      AUTH_MODE: ${AUTH_MODE:-local}
      # Invite-only magic-link sign-in: set APP_ORIGIN to the public https URL plus the mail settings.
      APP_ORIGIN: ${APP_ORIGIN:-}
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Nginx sets X-Real-IP; sign-in rate limits key on it.
      TRUST_PROXY: "true"
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Readiness includes a database round trip, so a lost PostgreSQL connection marks the API unhealthy.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      target: web
      args:
        VITE_API_MODE: server
        # No colon: an explicitly empty value (email sign-in) must stay empty instead of falling back to the demo user.
        VITE_DEV_USER_ID: ${VITE_DEV_USER_ID-00000000-0000-4000-8000-000000000001}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
    restart: unless-stopped
    ports:
      # With a domain (profile "https") this is bound to 127.0.0.1 and only Caddy is public.
      - "${NIYAT_HTTP_BIND:-0.0.0.0}:${NIYAT_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      NIYAT_DOMAIN: ${NIYAT_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.local/caddy/data:/data
      - ./.local/caddy/config:/config
    depends_on:
      - web